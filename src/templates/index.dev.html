<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0, viewport-fit=cover">

        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link href="{{ url_for('static', path='/css/styles.css') }}" rel="stylesheet">
        <link id="favicon" rel="icon" type="image/x-icon" href="static/favicon.ico">
        <title>Backyard Bridge</title>
    </head>

    <body>
        <header>
            <h1>Backyard Bridge</h1>
            <button id="rulesButton">Rules</button>
        </header>

        <div class="content">

            <div class="users-data">

                <div class="name-and-scores" id="nameAndScores">
                    <div class="playerName">
                        <p class="name-container">
                            Your name:
                            <span id="ws-id" class="hidden"></span>
                        </p>
                        <form id="nameForm" class="name-form">
                            <input type="text" id="nameInput" maxlength="13" class="name-input" />
                            <button id="changeName" type="submit" disabled>Change name</button>
                        </form>
                    </div>

                    <div class="playerScore">
                        <p id="scores" style="display: none;">
                            Your scores:
                            <span id="pS"></span>
                        </p>
                    </div>
                </div>

                <div class="users-list">
                    <div class="usersHeader" id="usersHeader">
                        <p>Active Players:</p>
                        <div class="usersContainer" id="usersList">

                        </div>

                    </div>
                </div>

            </div>

            <div class="preLobbyControls">
                <h2 id="welcomeMessage">To start the game create a lobby or join your friends by their lobby ID!</h2>
                <div class="errorMessage">
                    <div id="errorMessage" role="alert" aria-live="assertive"></div>
                </div>

                <div class="joinLobbyControls">
                    <input type="text" id="lobbyInput" placeholder="Enter lobby ID" />
                    <button id="joinLobbyButton" disabled>Join Lobby</button>
                </div>

                <button id="createLobbyButton">New Game</button>

                <div id="lobbyControls" style="display: none;">

                    <h2 id="lobbyMessage"></h2>

                    <div class="buttonContainer">
                        <button id="startButton" style="display: none;" disabled>Start Game</button>
                        <button id="addBotButton" style="display: none;">Add Bot</button>
                        <button id="leaveButton" style="display: none;">Leave Lobby</button>
                    </div>

                </div>

            </div>

            <div id="currentCards" style="display: none;">

                <div class="current-card" id="leftCard" role="button" aria-disabled="true" tabindex="-1">
                    <img src="/static/cards/closed_card.png" alt="closed_card" />
                </div>

                <div class="betweenCurrentCards">
                    <div id="scores-rate-now">
                        <p>Scores rate:</p>
                        <p class="scores-rate" id="scoresRate"></p>
                    </div>
                    <div id="cards-left">
                        <p>Cards left:</p>
                        <p class="deck-len" id="cardsLeft"></p>
                    </div>
                </div>

                <div class="current-card" id="rightCard" role="button" aria-disabled="true" tabindex="-1"></div>

            </div>

            <div id="jack-widget" class="jack-widget-window">
                <div class="jack-widget-grid">
                    <div class="jack-widget-cell-1">
                        <p>♠</p>
                    </div>
                    <div class="jack-widget-cell-2">
                        <p>♥</p>
                    </div>
                    <div class="jack-widget-cell-3">
                        <p>♦</p>
                    </div>
                    <div class="jack-widget-cell-4">
                        <p>♣</p>
                    </div>
                </div>
            </div>

            <div id="rules-widget" class="rules-widget-window">
                <div class="rules-widget-content">
                    <div class="rules-widget-header">
                        <span id="closeRulesWidget" class="close-rules-widget">&times;</span>
                    </div>
                    <div class="rules-column">
                        <p></p>
                    </div>
                </div>
            </div>

            <div id="game-over-widget" class="game-over-widget-window">
                <div class="game-over-widget-content">
                    <div class="results-column">
                        <p></p>
                    </div>

                    <div class="gameOverButtons">
                        <button id="continueGameButton">Start Game</button>
                        <button id="leaveGameButton">Leave Game</button>
                    </div>

                </div>
            </div>

            <div id="overlay" role="status" aria-live="polite" aria-label="Loading game">
                <div class="loader">
                    <div class="progress-bar">
                        <div class="progress"></div>
                    </div>
                </div>
            </div>

        </div>

        <footer>
            <div id="playerContainer">

                <p class="turnText" id="turnText" aria-live="polite"></p>

                <div id="playerHand"></div>

            </div>
        </footer>

    <script src="{{ url_for('static', path='/js/script.js') }}"></script>

    </body>

</html>
