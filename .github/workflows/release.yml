name: Release

on:
  push:
    tags:
      - "v.*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Verify release tag
        run: |
          VERSION=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v.${VERSION%.0}"
      - name: Install dependencies
        run: |
          uv sync --locked --dev
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify release
        run: |
          uv run --locked pytest
          npm test
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file CHANGELOG.md --title "Backyard Bridge $GITHUB_REF_NAME"
